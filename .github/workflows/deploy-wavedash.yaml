name: Deploy Wavedash

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (blank = latest stable)'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publish game to Wavedash'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: saltline-wavedash
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: wavedash
    env:
      NO_COLOR: '1'
      GH_TOKEN: ${{ github.token }}
      WAVEDASH_TOKEN: ${{ secrets.WAVEDASH_TOKEN }}
      WAVEDASH_GAME_ID: ${{ vars.WAVEDASH_GAME_ID }}
      WAVEDASH_UPLOAD_DIR: ./dist
      WAVEDASH_ENTRYPOINT: index.html
      VERSION: ${{ inputs.version }}
    steps:
      - name: Verify version and configuration
        run: |
          set -euo pipefail
          if [[ -z "$VERSION" ]]; then
            VERSION="$(gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName -q '.tagName')"
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Stable version required'; exit 1; }
          test -n "$WAVEDASH_TOKEN" || { echo 'Configure WAVEDASH_TOKEN secret'; exit 1; }
          test -n "$WAVEDASH_GAME_ID" || { echo 'Configure WAVEDASH_GAME_ID variable'; exit 1; }
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q '.isPrerelease' | grep -qx false
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download exact stable release build
        run: |
          set -euo pipefail
          mkdir -p tmp
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern 'saltline-web.zip*' --dir tmp
          (cd tmp && sha256sum --check saltline-web.zip.sha256)
          mkdir dist
          unzip -q tmp/saltline-web.zip -d dist
          test -s dist/index.html
          test -s dist/saltline_bg.wasm
          test -s dist/saltline.js

      - name: Install Wavedash CLI
        run: |
          set -euo pipefail
          curl -fsSL https://wavedash.com/cli/install.sh -o /tmp/install-wavedash.sh
          sh /tmp/install-wavedash.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.wavedash/bin" >> "$GITHUB_PATH"

      - name: Upload Wavedash build
        id: upload
        run: |
          set -euo pipefail
          # Generated on the runner, never committed to the repository.
          printf 'game_id = "%s"\nupload_dir = "./dist"\nentrypoint = "index.html"\n' \
            "$WAVEDASH_GAME_ID" > wavedash.toml
          wavedash build push -m "Saltline $VERSION" | tee /tmp/wavedash-upload.log
          build_id="$(sed -nE 's/^.*Build ID:[[:space:]]*([^[:space:]]+).*$/\1/p' /tmp/wavedash-upload.log | tail -1)"
          test -n "$build_id" || { echo 'Could not extract Wavedash build ID'; exit 1; }
          playtest_url="$(grep -oE 'https://[^[:space:]]+/playtest/[^[:space:]]+' /tmp/wavedash-upload.log | tail -1)"
          test -n "$playtest_url" || { echo 'Could not extract Wavedash playtest URL'; exit 1; }
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "Playtest URL: $playtest_url"
          {
            echo "### Wavedash deployment"
            echo "Version: $VERSION"
            echo "Wavedash build: $build_id"
            echo "Playtest URL: $playtest_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Wavedash build
        if: ${{ inputs.publish == true }}
        env:
          BUILD_ID: ${{ steps.upload.outputs.build_id }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if wavedash publish "$BUILD_ID" --yes --title "Saltline $VERSION" > /tmp/wavedash-publish.log 2>&1; then
              cat /tmp/wavedash-publish.log
              exit 0
            else
              status=$?
            fi
            cat /tmp/wavedash-publish.log
            if ! grep -Fq 'Only completed builds can be published' /tmp/wavedash-publish.log; then
              exit "$status"
            fi
            if [[ "$attempt" -eq 20 ]]; then
              echo 'Build was not ready to publish after 20 attempts'
              exit "$status"
            fi
            echo "Build is still processing (attempt $attempt/20); retrying in 15 seconds"
            sleep 15
          done
