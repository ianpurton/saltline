name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saltline-release
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2

jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Calculate semantic version and RC number
        id: version
        run: |
          set -euo pipefail
          git fetch --force --tags
          python3 - <<'PYTHON'
          import os, re, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          stable = []
          prerelease = []
          for tag in git('tag', '--list').splitlines():
              if m := re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)', tag):
                  stable.append((tuple(map(int, m.groups())), tag))
              elif m := re.fullmatch(r'v(\d+)\.(\d+)\.(\d+)-rc\.(\d+)', tag):
                  prerelease.append((tuple(map(int, m.groups()[:3])), int(m.group(4)), tag))
          # Stable versions must be ancestors of the selected main commit.
          stable = [(v, t) for v, t in stable if subprocess.run(
              ['git', 'merge-base', '--is-ancestor', t, 'HEAD']).returncode == 0]
          base_version, base_tag = max(stable) if stable else ((0, 0, 0), None)
          log = git('log', '--format=%s%n%b%x00', f'{base_tag}..HEAD' if base_tag else 'HEAD')
          commits = [entry.strip() for entry in log.split('\x00') if entry.strip()]
          breaking = any(re.search(r'(?m)^BREAKING CHANGE:', c) or
                         re.match(r'^[a-z][a-z0-9-]*(?:\([^)]*\))?!:', c) for c in commits)
          feature = any(re.match(r'^feat(?:\([^)]*\))?:', c) for c in commits)
          fix = any(re.match(r'^fix(?:\([^)]*\))?:', c) for c in commits)
          # Before the first stable release, start at v0.1.0.
          if not base_tag:
              target = (0, 1, 0)
          elif breaking:
              target = (base_version[0] + 1, 0, 0)
          elif feature:
              target = (base_version[0], base_version[1] + 1, 0)
          else:
              # Also allow manual candidates after non-conventional commits.
              target = (base_version[0], base_version[1], base_version[2] + 1)
          # Once the RC series starts, keep its version stable until promotion.
          eligible = [(v, n, t) for v, n, t in prerelease if v > base_version]
          if eligible:
              target = max(eligible, key=lambda x: (x[0], x[1]))[0]
          rc_num = 1 + max((n for v, n, _ in prerelease if v == target), default=0)
          tag = f'v{target[0]}.{target[1]}.{target[2]}-rc.{rc_num}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={tag}\n')
          print(f'Candidate: {tag} (base: {base_tag or "none"})')
          PYTHON

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web-release

      - name: Install matching wasm-bindgen CLI
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(next(p["version"] for p in tomllib.load(open("Cargo.lock", "rb"))["package"] if p["name"] == "wasm-bindgen"))')"
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build and package Saltline for WebGPU
        run: scripts/build-web.sh

      - name: Tag and publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag already exists: $TAG" >&2; exit 1
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" \
            -f "sha=$GITHUB_SHA"
          gh release create "$TAG" saltline-web.zip saltline-web.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --prerelease --generate-notes \
            --verify-tag
          {
            echo "### $TAG"
            echo "Commit: $(git rev-parse HEAD)"
            echo "SHA-256: $(cut -d' ' -f1 saltline-web.zip.sha256)"
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
