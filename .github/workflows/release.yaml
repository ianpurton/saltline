name: Release

on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'RC tag (blank = latest RC)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: saltline-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate selected candidate
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ inputs.release_candidate }}
        run: |
          set -euo pipefail
          git fetch --tags
          if [[ -z "$RC" ]]; then
            # An empty match (1) or head closing the pipe early (141) is expected.
            RC="$(git tag -l 'v*-rc.*' --sort=-v:refname |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$' |
              head -n 1)" || {
              status=$?
              if [[ "$status" != 1 && "$status" != 141 ]]; then exit "$status"; fi
            }
            [[ -n "$RC" ]] || { echo 'No RC tag exists to promote' >&2; exit 1; }
          fi
          [[ "$RC" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]] || { echo "Invalid RC tag: $RC" >&2; exit 1; }
          VERSION="${RC%-rc.*}"
          if ! gh release view "$RC" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q '.isPrerelease' | grep -qx true; then
            echo "Selected RC $RC must have an existing GitHub prerelease" >&2; exit 1
          fi
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Stable release $VERSION already exists" >&2; exit 1
          fi
          git rev-parse --verify "refs/tags/$RC^{commit}" >/dev/null
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Stable tag $VERSION already exists" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          {
            echo "Selected RC: $RC"
            echo "Stable version: $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download and verify original RC assets
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.version.outputs.rc }}
        run: |
          set -euo pipefail
          gh release download "$RC" --repo "$GITHUB_REPOSITORY" \
            --pattern 'saltline-web.zip*' --dir .
          test -s saltline-web.zip
          test -s saltline-web.zip.sha256
          sha256sum --check saltline-web.zip.sha256
          unzip -tq saltline-web.zip

      - name: Promote unchanged build to stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.version.outputs.rc }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse "refs/tags/$RC^{commit}")"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$VERSION" \
            -f "sha=$sha"
          gh release create "$VERSION" saltline-web.zip saltline-web.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$VERSION" --latest --verify-tag \
            --notes "Promoted unchanged from $RC ($sha)."
          {
            echo "### $VERSION"
            echo "Promoted from: $RC"
            echo "Commit: $sha"
            echo "SHA-256: $(cut -d' ' -f1 saltline-web.zip.sha256)"
          } >> "$GITHUB_STEP_SUMMARY"
