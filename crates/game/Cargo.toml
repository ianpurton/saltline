[package]
name = "saltline-game"
version = "0.1.0"
edition = "2024"
[features]
trace-chrome = ["bevy/trace_chrome"]
trace-tracy = ["bevy/trace_tracy"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy.workspace = true
saltline-world = { path = "../world" }
saltline-models = { path = "../models" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgl2"] }
