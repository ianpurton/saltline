<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Saltline</title>
  <link rel="icon" href="data:,">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e10;color:#e8e6d9;font-family:system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;outline:none}
    #status{position:absolute;inset:40% 10% auto;text-align:center;pointer-events:none;white-space:pre-line}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Saltline game"></canvas>
  <div id="status" role="status">Loading SALTLINE…</div>
  <script type="module">
    import init from './saltline.js';
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#game');
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus());
    const fail = error => {
      console.error('Saltline:', error);
      status.hidden = false;
      status.textContent = 'Unable to start SALTLINE.\n' + (error.message || String(error));
    };
    window.addEventListener('error', event => fail(event.error || event.message));
    window.addEventListener('unhandledrejection', event => fail(event.reason));
    try {
      const probe = document.createElement('canvas').getContext('webgl2');
      if (!probe) {
        throw new Error('WebGL 2 is required. Use a WebGL 2-capable browser with hardware acceleration enabled.');
      }
      probe.getExtension('WEBGL_lose_context')?.loseContext();
      // The Wavedash host provides its SDK; local hosting also works without it.
      if (window.Wavedash) window.Wavedash.init({debug: false});
      await init();
      status.hidden = true;
      canvas.focus();
    } catch (error) { fail(error); }
  </script>
</body>
</html>
