<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Saltline</title>
  <link rel="icon" href="data:,">
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090e10;color:#e8e6d9;font-family:system-ui,sans-serif}
    canvas{display:block;width:100%;height:100%;outline:none}
    #status{position:absolute;inset:40% 10% auto;text-align:center;pointer-events:none;white-space:pre-line}
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Saltline game"></canvas>
  <div id="status" role="status">Loading SALTLINE…</div>
  <script type="module">
    import init from './saltline.js';
    const status = document.querySelector('#status');
    const canvas = document.querySelector('#game');
    let started = false, failed = false, lockPending = false, lastLockRequest = -Infinity;
    const lockHint = () => {
      if (!started || failed) return;
      status.hidden = false;
      status.textContent = 'Click the game to capture the mouse. Press Esc to release it.';
    };
    // Winit's WebGL window API does not consume the promise returned by modern
    // browsers. Handle only pointer-lock failures here; rendering failures still
    // reach the fatal error handler below. Never retry without a new game input.
    const requestLock = canvas.requestPointerLock;
    canvas.requestPointerLock = async function (...args) {
      if (document.pointerLockElement === canvas || lockPending || performance.now() - lastLockRequest < 1000) return;
      lockPending = true;
      lastLockRequest = performance.now();
      try { await requestLock.apply(this, args); }
      catch { lockHint(); }
      finally { lockPending = false; }
    };
    document.addEventListener('pointerlockerror', lockHint);
    document.addEventListener('pointerlockchange', () => {
      if (document.pointerLockElement === canvas && !failed) status.hidden = true;
    });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('pointerdown', () => canvas.focus());
    const fail = error => {
      failed = true;
      console.error('Saltline:', error);
      status.hidden = false;
      status.textContent = 'Unable to start SALTLINE.\n' + (error.message || String(error));
    };
    window.addEventListener('error', event => fail(event.error || event.message));
    window.addEventListener('unhandledrejection', event => fail(event.reason));
    try {
      const probe = document.createElement('canvas').getContext('webgl2');
      if (!probe) {
        throw new Error('WebGL 2 is required. Use a WebGL 2-capable browser with hardware acceleration enabled.');
      }
      probe.getExtension('WEBGL_lose_context')?.loseContext();
      // The Wavedash host provides its SDK; local hosting also works without it.
      if (window.Wavedash) window.Wavedash.init({debug: false});
      await init();
      started = true;
      status.hidden = true;
      canvas.focus();
    } catch (error) { fail(error); }
  </script>
</body>
</html>
